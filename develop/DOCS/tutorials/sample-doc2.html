<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Moved - Redirecting...</title>
    
    <!-- Immediate redirect via meta refresh -->
    <meta http-equiv="refresh" content="0; url=/architectures/sample-doc2.html">
    
    <!-- Canonical URL for SEO -->
    <link rel="canonical" href="https://FINAL_DOMAIN_TO_SET/architectures/sample-doc2.html">
    
    <!-- JavaScript redirect (faster than meta refresh) -->
    <script>
        window.location.replace("/architectures/sample-doc2.html");
    </script>
    
</head>
<body>
    <div class="redirect-message">
        <div class="spinner"></div>
        <h2>Page Moved</h2>
        <p>This page has moved to a new location.</p>
        <p>If you are not redirected automatically, <a href="/architectures/sample-doc2.html">click here</a>.</p>
    </div>
</body>
</html>
