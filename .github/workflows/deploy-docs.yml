name: Deploy Documentation

on:
  push:
    branches:
      - develop
      - test
      - main
  workflow_run:
    workflows: ["Auto Merge Approved PRs"]
    types:
      - completed

jobs:
  deploy_docs:
    name: Build and Deploy Docs [${{ github.ref_name }}]
    runs-on: ubuntu-latest

    container:
      image: mckeea/quarto-doc-builder:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Mark repo as safe for Git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build Docs
        run: .github/scripts/build-docs.sh

      - name: Commit updated redirect and url mappings
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"

          git add redirect_map.json url_mapping.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update redirect and URL mappings [skip ci]"
            git push origin HEAD
          fi

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site
          target-folder: ${{ github.ref_name }}
          clean: true
          token: ${{ secrets.GITHUB_TOKEN }}
